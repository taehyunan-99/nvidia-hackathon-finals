id: family-minimum-nvidia
display_name: Family minimum NVIDIA
description: Dedicated public sample inspection model; attach only to its sandbox
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: Existing NVIDIA inference API credential
    env_vars: [NVIDIA_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: integrate.api.nvidia.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow:
          method: POST
          path: /v1/chat/completions
binaries: [/usr/local/bin/python3.12]
