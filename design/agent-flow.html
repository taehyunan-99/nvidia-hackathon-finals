<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>에이전트 실행 흐름 · 로컬 리허설</title>
<link rel="stylesheet" href="../.agents/skills/nvidia-ui/assets/tokens.css">
<link rel="stylesheet" href="../.agents/skills/nvidia-ui/assets/components.css">
<link rel="stylesheet" href="../.agents/skills/nvidia-ui/assets/agent-flow.css">
<style>
body{margin:0}main{max-width:1440px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:24px}.brand{font-weight:700}.mode{font-size:13px;border:1px solid var(--line);padding:6px 12px}.intro{padding:32px 0}.intro h1{font-size:32px;line-height:1.3;margin:8px 0 12px}.eyebrow{color:var(--accent-ink);font-size:13px;font-weight:700;letter-spacing:1px}.setup{display:grid;grid-template-columns:minmax(250px,1fr) 2fr;gap:var(--card-horizontal-gap);align-items:end}.workspace{grid-template-columns:minmax(0,2fr) minmax(280px,1fr);margin-top:var(--card-vertical-gap);align-items:start}.setup p{margin-top:12px}.links{display:flex;gap:24px;margin-top:24px;font-size:13px}.links a{color:var(--accent-ink)}.nv-actions{margin-top:20px}#announcement{margin:12px 0 0;min-height:22px}#load-error{color:var(--state-failed-color)}
</style>
</head>
<body class="nv-ui"><main>
<header class="top"><span class="brand">AGENT WORKSPACE</span><span class="mode" id="mode">MOCK · 합성 예시 · 외부 호출 0회</span></header>
<section class="intro"><span class="eyebrow">LOCAL REHEARSAL</span><h1>근거를 확인하고, 다음 도구를 선택합니다</h1><p class="nv-description">기존 근거의 재사용부터 추가 조사와 보류까지, 같은 화면에서 서로 다른 실행 경로를 확인합니다.</p></section>
<section class="nv-card setup" aria-label="예시 선택">
<div><label class="nv-label" for="scenario">관측 상황</label><select class="nv-input" id="scenario" disabled></select></div>
<div><p class="nv-description" id="provenance">규칙 기반 mock 판단과 로컬 합성 도구의 실행 기록입니다. 재생 속도는 실제 분석 시간이 아닙니다.</p><div class="nv-actions"><button class="nv-button nv-primary" id="play" disabled>예시 재생</button><button class="nv-button nv-secondary" id="step" disabled>다음 단계</button><button class="nv-button nv-secondary" id="reset" disabled>처음으로</button></div></div>
<p id="announcement" role="status" class="nv-description">예시 불러오는 중</p><p id="load-error" role="alert" hidden></p>
</section>
<div class="nv-card-grid workspace"><section class="nv-card" id="flow" aria-label="실행 흐름"></section><aside class="nv-card" id="result" aria-label="결과와 근거"></aside></div>
<nav class="links"><a href="playground.html">확정 컴포넌트 보기</a><a href="../docs/catalog/contracts.md">입출력 계약</a><a id="data-link" href="../docs/playbooks/examples/research/fixtures.json">예시 JSON</a></nav>
</main><script type="module" src="agent-flow.mjs"></script></body></html>
